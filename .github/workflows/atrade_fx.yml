name: atrade-fx

on:
  # GitHub schedules are UTC; dispatch_fx.py applies ET/DST windows itself.
  # The near-24h tick is also the stop-protection cadence for open positions.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'atrade/**'
      - 'deploy/dispatch_fx.py'
      - 'tests/**'
      - '.github/workflows/atrade_fx.yml'

permissions:
  contents: write

concurrency:
  group: atrade-fx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fake-clock and paper-book tests
        run: python -m unittest discover -s tests -p 'test_fx_*.py' -v

  run-paper-book:
    if: ${{ github.event_name != 'pull_request' }}
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run FX dispatcher (MockBroker only)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python deploy/dispatch_fx.py --state-dir state_fx
      - name: Persist isolated FX state
        run: |
          git config user.name "atrade-fx-bot"
          git config user.email "atrade-fx-bot@users.noreply.github.com"
          git add -A -- PLAYBOOK.md state_fx
          if git diff --cached --quiet; then
            echo "no FX state or playbook changes"
          else
            git commit -m "atrade FX run $(date -u +%Y-%m-%dT%H:%MZ)"
            git fetch origin "${GITHUB_REF_NAME}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
