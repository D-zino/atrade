# A-Trade via GitHub Actions (free scheduled runner — no VPS needed).
# Put this file at .github/workflows/atrade.yml in your GitHub repo.
#
# Runs every 10 minutes, every day, 13:00-23:00 and 00:00-01:20 UTC — that
# range covers all four ET sessions in BOTH DST states:
#   09:25 ET open · 10:30 ET check-in · 15:50 ET close · 20:00 ET preview
# dispatch.py applies the exact windows and skips weekends/holidays, so
# nothing executes outside the trading schedule. State (ledger, playbook,
# reports) is committed back to the repo after each run.
#
# Setup: see the README "Deploy on GitHub Actions" section. You need these
# repo Secrets (Settings → Secrets and variables → Actions):
#   ALPACA_API_KEY, ALPACA_SECRET_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
name: atrade

on:
  schedule:
    - cron: '*/10 13-23,0-1 * * *'   # every 10 min all day-ish; dispatch guards times/weekends
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Send a test Telegram message now (setup verification)'
        type: boolean
        default: false
      test_checkin:
        description: 'Send a mid-session check-in Telegram now (test)'
        type: boolean
        default: false
      test_preview:
        description: 'Send a tomorrow-preview Telegram now (test)'
        type: boolean
        default: false
      test_week_ahead:
        description: 'Send the Sunday week-ahead digest Telegram now (test)'
        type: boolean
        default: false
      resume:
        description: 'Resume the agent after an auto-pause'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send Telegram test message
        if: ${{ github.event.inputs.test_telegram == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: SEND_TEST_TELEGRAM=1 python deploy/dispatch.py

      - name: Send Telegram test check-in
        if: ${{ github.event.inputs.test_checkin == 'true' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: SEND_CHECKIN=1 python deploy/dispatch.py

      - name: Send Telegram test tomorrow-preview
        if: ${{ github.event.inputs.test_preview == 'true' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: SEND_PREVIEW=1 python deploy/dispatch.py

      - name: Send Telegram test week-ahead digest
        if: ${{ github.event.inputs.test_week_ahead == 'true' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: SEND_WEEK_AHEAD=1 python deploy/dispatch.py

      - name: Resume agent after pause
        if: ${{ github.event.inputs.resume == 'true' }}
        run: RESUME=1 python deploy/dispatch.py

      - name: Run scheduled session
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python deploy/dispatch.py

      - name: Persist state (ledger, playbook, reports)
        run: |
          git config user.name "atrade-bot"
          git config user.email "atrade-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "atrade run $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
